[workspace]
members = ["crates/cr-core", "crates/cr-engine", "crates/cr-packs", "crates/cr-midi", "crates/cr-server", "crates/cr-osc", "crates/cr-s88", "crates/controlroom"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.96"

[workspace.dependencies]
anyhow = "1.0"
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_norway = "0.9"
crossbeam-channel = "0.5"
midir = "0.11"
serde_json = "1.0"
tokio = { version = "1.53", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
axum = { version = "0.8", features = ["json", "ws"] }
futures-util = "0.3"
rosc = "0.11"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
